<script>
   const form = document.getElementById("form");
form.addEventListener("submit", formSubmit);

function formSubmit(e) {
    e.preventDefault(); // Evita la redirección

    const formData = new FormData(e.target);

    fetch("https://getform.io/f/adrknmya", {
        method: "POST",
        body: formData,
        headers: {
            "Accept": "application/json",
        },
    })
    .then(response => {
        if (response.ok) {
            // Mostrar un pop-up o mensaje dentro de la misma página
            showThankYouMessage();
            // Opcional: resetear el formulario
            form.reset();
        } else {
            console.log("Error en el envío");
        }
    })
    .catch(error => console.log(error));
}

function showThankYouMessage() {
    const popup = document.createElement("div");
    popup.style.position = "fixed";
    popup.style.top = "50%";
    popup.style.left = "50%";
    popup.style.transform = "translate(-50%, -50%)";
    popup.style.background = "#fff";
    popup.style.padding = "20px";
    popup.style.border = "2px solid #333";
    popup.style.zIndex = "9999";
    popup.innerText = "¡Gracias! Tu mensaje ha sido enviado.";

    document.body.appendChild(popup);

    // Ocultar el pop-up después de 3 segundos
    setTimeout(() => {
        popup.remove();
    }, 3000);
}

</script>

    <script>
      // esto hace crecer el textbox automaticamente segun la cantidad de lineas
    const textarea = document.getElementById("message");
    
    textarea.addEventListener("input", function() {
        // Contar cuántas líneas hay en el textarea
        const lines = textarea.value.split("\n").length;
        // Ajustar el número de filas (mínimo 1)
        textarea.rows = Math.max(lines, 1);
    });
    </script>
