<!--Menu-->
 
  <div id="header"></div>
   
  <div class="container" style="margin-top: 12rem;" id="contact">

  <h1 class="text-center mt-5 mb-5">Contact</h1>
  <div class="wrapper px-5 gap-5 contact-layout">
    <div class="contact-info">
      <p class="mb-4">
        Fill out the form or reach us directly. We’ll get back to you shortly.
      </p>
  
      <div class="contact-direct">
        <a href="mailto:jgyourstudio@gmail.com">
          <i class="fa-solid fa-envelope"></i>
          jgyourstudio@gmail.com
        </a>
  
        <a href="tel:+15023457226">
          <i class="fa-solid fa-phone"></i>
          (502) 345-7226
        </a>
      </div>
    </div>
  
    <form action="https://formsubmit.co/jgyourstudio@gmail.com" method="POST">
      <div class="mb-3 input-box has-value">
        <input type="text" name="name" id="name" required>
        <label for="name" class="form-label">Name</label>
      </div>
  
      <div class="mb-3 input-box has-value">
        <input type="email" name="email" id="email" required>
        <label for="email" class="form-label">Email</label>
      </div>
  
      <div class="mb-3 input-box has-value">
        <textarea name="message" id="message" rows="5" required style="overflow:hidden;"></textarea>
        <label for="message" class="form-label">Message</label>
      </div>
  
      <div>
        <button type="submit" class="mb-3 btn hvr-grow mybtn">Send Message</button>
      </div>
  
      <input type="hidden" name="_next" value="https://jgstudio.vercel.app/thankyou.html">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
    </form>
  </div>
