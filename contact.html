<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"/>
  <title>J&G Photography</title>
  <link rel="stylesheet" href="css/styles2.css">
  <!--Boostrap for links-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!--fontaweson for links-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-...tuhash..."  crossorigin="anonymous"  referrerpolicy="no-referrer" />
  <!-- At the Head ->  AOS CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body style="height: 100%;">

<!--Menu-->
 
  <div id="header"></div>
   
  <div class="container" style="margin-top: 12rem;" id="contact">

  <h1 class="text-center mt-5 mb-5">Contact</h1>
   <div>
    <p class="mb-5 text-center">
      For questions, service requests, or feedback, please fill out the form below.
We’ll get back to you shortly!
    </p>
   </div>
            
   <form action="https://formsubmit.co/jgyourstudio@gmail.com" method="POST">  
   
      <!-- Name -->    
      <div class="mb-3 input-box has-value">
        <input type="text" name="name" id="name" required>
        <label for="name" class="form-label">Name</label>
      </div>      
      <!-- Email -->
      <div class="mb-3 input-box has-value">       
        <input type="email" name="email" id="email" required>
        <label for="email" class="form-label">Email</label>
      </div>      
      <!-- Message -->
      <div class="mb-3 input-box has-value">        
        <textarea name="message" id="message" rows="5" required style="overflow:hidden;"></textarea>
        <label for="email" class="form-label">message</label>
      </div>
  
      <!-- Botón de envío -->
      <div class="text-center">
        <button type="submit" class="mb-3 btn text-center hvr-grow mybtn mb-3">Send Message</button>
      </div>
  
      <!-- Opcionales (evita spam y redirecciones) -->
      <input type="hidden" name="_next" value="https://jgstudio.vercel.app/thankyou.html">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
  
    </form>
    </div>
<!--FOOTER-->
<footer class="d-flex justify-content-center w-100" id="foot_bar">
  <div id="div_menubotom">
    <a href="https://www.facebook.com/profile.php?id=61559554461199" class="hvr-grow lnkMenu" target="_blank"><i class="fab fa-facebook-f"></i></a>
    <a href="https://www.instagram.com/jlprezc/" class="hvr-grow lnkMenu" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://twitter.com" class="hvr-grow lnkMenu" target="_blank"><i class="fab fa-twitter"></i></a>
    </div>
</footer>

<!-- Bootstrap Bundle JS (Popper incluido) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({
  duration: 800, // duración por defecto en ms
  once: true     // animar solo una vez al hacer scroll
});
</script>
<script src="js/script2.js"></script>

</body>
</html>
